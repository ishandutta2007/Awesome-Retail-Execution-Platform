<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="shelfGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" />
    </pattern>
    <style>
      @keyframes scanMotion {
        0% { transform: translateY(80px); opacity: 0.2; }
        50% { transform: translateY(320px); opacity: 0.9; }
        100% { transform: translateY(80px); opacity: 0.2; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #38BDF8); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .scanner-beam {
        animation: scanMotion 4s ease-in-out infinite;
      }
      .pulsing-dot {
        animation: pulseNode 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .badge-float-1 {
        animation: floatBadge 3.5s ease-in-out infinite;
      }
      .badge-float-2 {
        animation: floatBadge 4.2s ease-in-out infinite 0.8s;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#shelfGrid)" />

  <!-- Decorative Ambient Glow Circles -->
  <circle cx="150" cy="100" r="220" fill="#38BDF8" opacity="0.07" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="250" fill="#818CF8" opacity="0.08" filter="url(#glow)" />
  <circle cx="950" cy="120" r="180" fill="#10B981" opacity="0.06" filter="url(#glow)" />

  <!-- Digital Shelf Architecture Mockup (Right Side) -->
  <g transform="translate(760, 60)">
    <!-- Outer Shelf Frame -->
    <rect x="0" y="20" width="380" height="260" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <rect x="15" y="35" width="350" height="230" rx="8" fill="#090D1A" stroke="#1E293B" stroke-width="1" />
    
    <!-- Shelf Lines -->
    <line x1="20" y1="105" x2="360" y2="105" stroke="#475569" stroke-width="2" />
    <line x1="20" y1="180" x2="360" y2="180" stroke="#475569" stroke-width="2" />

    <!-- Shelf Products / SKUs Tier 1 -->
    <rect x="35" y="55" width="30" height="50" rx="4" fill="#38BDF8" opacity="0.8" />
    <rect x="75" y="50" width="32" height="55" rx="4" fill="#38BDF8" opacity="0.9" />
    <rect x="117" y="55" width="30" height="50" rx="4" fill="#818CF8" opacity="0.8" />
    <rect x="157" y="60" width="28" height="45" rx="4" fill="#64748B" opacity="0.4" stroke="#EF4444" stroke-dasharray="2 2" />
    <rect x="195" y="52" width="34" height="53" rx="4" fill="#10B981" opacity="0.85" />
    <rect x="239" y="55" width="30" height="50" rx="4" fill="#10B981" opacity="0.85" />
    <rect x="279" y="48" width="36" height="57" rx="4" fill="#C084FC" opacity="0.85" />
    <rect x="325" y="55" width="25" height="50" rx="4" fill="#C084FC" opacity="0.85" />

    <!-- Shelf Products / SKUs Tier 2 -->
    <rect x="35" y="130" width="35" height="50" rx="4" fill="#F59E0B" opacity="0.85" />
    <rect x="80" y="130" width="35" height="50" rx="4" fill="#F59E0B" opacity="0.85" />
    <rect x="125" y="125" width="38" height="55" rx="4" fill="#10B981" opacity="0.9" />
    <rect x="173" y="125" width="38" height="55" rx="4" fill="#10B981" opacity="0.9" />
    <rect x="221" y="135" width="30" height="45" rx="4" fill="#38BDF8" opacity="0.85" />
    <rect x="261" y="135" width="30" height="45" rx="4" fill="#38BDF8" opacity="0.85" />
    <rect x="301" y="130" width="35" height="50" rx="4" fill="#818CF8" opacity="0.85" />

    <!-- Shelf Products / SKUs Tier 3 -->
    <rect x="40" y="205" width="45" height="55" rx="4" fill="#06B6D4" opacity="0.8" />
    <rect x="95" y="205" width="45" height="55" rx="4" fill="#06B6D4" opacity="0.8" />
    <rect x="150" y="210" width="40" height="50" rx="4" fill="#818CF8" opacity="0.85" />
    <rect x="200" y="210" width="40" height="50" rx="4" fill="#818CF8" opacity="0.85" />
    <rect x="250" y="205" width="45" height="55" rx="4" fill="#10B981" opacity="0.9" />
    <rect x="305" y="205" width="45" height="55" rx="4" fill="#10B981" opacity="0.9" />

    <!-- Computer Vision Bounding Boxes & Tags -->
    <rect x="71" y="46" width="40" height="63" rx="2" fill="none" stroke="#10B981" stroke-width="1.5" />
    <rect x="71" y="38" width="36" height="10" rx="2" fill="#10B981" />
    <text x="73" y="45" fill="#042F2E" font-size="7" font-family="sans-serif" font-weight="bold">99.8%</text>

    <rect x="153" y="56" width="36" height="53" rx="2" fill="none" stroke="#EF4444" stroke-width="1.5" />
    <rect x="153" y="48" width="28" height="10" rx="2" fill="#EF4444" />
    <text x="155" y="55" fill="#FEF2F2" font-size="7" font-family="sans-serif" font-weight="bold">OOS</text>

    <!-- Dynamic Scanning Laser Beam -->
    <g class="scanner-beam">
      <line x1="15" y1="0" x2="365" y2="0" stroke="url(#scanGrad)" stroke-width="3" filter="url(#glow)" />
      <polygon points="15,-12 365,-12 365,0 15,0" fill="url(#scanGrad)" opacity="0.25" />
    </g>
  </g>

  <!-- Left Side: Title & Feature Showcase -->
  <g transform="translate(80, 80)">
    <!-- Eyebrow Pill -->
    <g class="badge-float-1">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="5" fill="#10B981" class="pulsing-dot" />
      <text x="32" y="21" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">RETAIL EXECUTION PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Awesome Retail Execution</text>
    <text x="0" y="132" fill="url(#primaryGrad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="700">CPG Field Force &amp; Shelf Intelligence</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="400">
      Curated ecosystem of SaaS &amp; Open-Source platforms for store visits,
    </text>
    <text x="0" y="196" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="400">
      planogram compliance, AI shelf vision audits, and route-to-market.
    </text>

    <!-- Floating Metric Highlights -->
    <g transform="translate(0, 225)">
      <!-- Metric 1 -->
      <g>
        <rect x="0" y="0" width="160" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#38BDF8" font-family="sans-serif" font-size="14">⚡</text>
        <text x="36" y="26" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">Field Force SFA</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="170" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#10B981" font-family="sans-serif" font-size="14">👁️</text>
        <text x="36" y="26" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">AI Shelf Audits</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="185" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#C084FC" font-family="sans-serif" font-size="14">📊</text>
        <text x="36" y="26" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">Planogram Audit</text>
      </g>
    </g>
  </g>
</svg>